  <nav class="tabs" role="tablist" aria-label="Screens" id="tabs">
    <button type="button" role="tab" aria-selected="false" aria-controls="v-book" data-v="book">Price book <span class="cnt" id="cBook"></span></button>
    <button type="button" role="tab" aria-selected="true" aria-controls="v-build" data-v="build">Build</button>
    <button type="button" role="tab" aria-selected="false" aria-controls="v-doc" data-v="doc">Preview</button>
    <button type="button" role="tab" aria-selected="false" aria-controls="v-sent" data-v="sent">Sent <span class="cnt" id="cSent"></span></button>
  </nav>
  <section id="v-book" class="view" role="tabpanel" aria-label="Price book" hidden>
    <div class="stats" id="bookStats"></div>
    <div class="bookbar">
      <div class="srch">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="6" cy="6" r="4.2"/><path d="M9.2 9.2 12.5 12.5"/></svg>
        <input class="in" type="search" id="bookQ" placeholder="Search the book" aria-label="Search the price book">
      </div>
      <div class="seg" id="catSeg" role="group" aria-label="Filter by category"></div>
      <span class="sp"></span>
      <button class="btn" id="addItemBtn" type="button">Add item</button>
    </div>
    <div class="card">
      <table class="tbl cards" id="bookTbl">
        <thead><tr>
          <th>Item</th><th style="width:96px">Unit</th><th class="r" style="width:104px">Cost £</th>
          <th class="r" style="width:88px">Markup %</th><th class="r" style="width:112px">Sell</th><th style="width:36px"></th>
        </tr></thead>
        <tbody id="bookBody"></tbody>
      </table>
    </div>
  </section>
  <section id="v-build" class="view" role="tabpanel" aria-label="Build an estimate">
    <div class="build">
      <div>
        <div class="card" style="margin-bottom:12px">
          <div class="card-hd">
            <h2>Customer</h2>
            <p id="refLbl"></p>
            <span class="sp"></span>
            <div class="seg" id="custSeg" role="group" aria-label="Pick a customer on the books"></div>
          </div>
          <div class="cust">
            <div><label class="fl" for="cName">Name</label><input class="in" id="cName" autocomplete="off"></div>
            <div><label class="fl" for="cPhone">Phone</label><input class="in" id="cPhone" autocomplete="off"></div>
            <div class="full"><label class="fl" for="cAddr">Address</label><input class="in" id="cAddr" autocomplete="off"></div>
            <div class="full"><label class="fl" for="cTitle">What the job is</label><input class="in" id="cTitle" autocomplete="off"></div>
          </div>
        </div>
        <div id="secs"></div>
        <button class="btn" id="addSecBtn" type="button">Add a section</button>
        <div class="card" style="margin-top:12px">
          <div class="card-hd"><h2>Notes &amp; terms</h2><p>Printed on the estimate</p></div>
          <div class="notes">
            <div><label class="fl" for="eNotes">Notes for the customer</label><textarea id="eNotes"></textarea></div>
            <div><label class="fl" for="eTerms">Terms</label><textarea id="eTerms"></textarea></div>
          </div>
        </div>
      </div>
      <aside class="rail">
        <div class="total" id="totalPanel"></div>
      </aside>
    </div>
  </section>
  <section id="v-doc" class="view" role="tabpanel" aria-label="Estimate preview" hidden>
    <div class="docbar" id="docbar"></div>
    <div class="doctrail" id="doctrail" hidden></div>
    <div class="sheetwrap" id="sheetwrap"><article class="sheet" id="sheet"></article></div>
    <div class="custbar" id="custbar" hidden></div>
  </section>
  <section id="v-sent" class="view" role="tabpanel" aria-label="Sent estimates" hidden>
    <div class="stats" id="sentStats"></div>
    <div class="card">
      <div class="card-hd"><h2>Estimates</h2><p id="sentSub"></p></div>
      <table class="tbl cards" id="sentTbl">
        <thead><tr>
          <th>Ref</th><th>Customer</th><th>Job</th><th class="r" style="width:104px">Total</th>
          <th style="width:88px">State</th><th style="width:132px">Last thing</th><th style="width:88px"></th>
        </tr></thead>
        <tbody id="sentBody"></tbody>
      </table>
    </div>
  </section>
</main>
<div class="scrim" id="scrim" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modal"></div></div>
