<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#FFFFFF;color:#141416;overflow:hidden;position:relative;font-family:"Schibsted Grotesk",-apple-system,sans-serif}
.pad{position:relative;padding:56px 64px;height:100%;display:flex;flex-direction:column;justify-content:space-between;width:100%}
body.has-phone .pad{width:760px}
.top{display:flex;align-items:center;gap:20px}
.wm{font-weight:700;font-size:30px;letter-spacing:-.04em}.wm i{font-style:normal;color:var(--c,#E8A84B)}
.kick{font-size:18px;font-weight:500;color:#6B6B70}
h1{font-weight:600;font-size:80px;line-height:1;letter-spacing:-.04em;max-width:1040px;overflow-wrap:anywhere;text-wrap:balance}
.sub{color:#6B6B70;font-size:24px;max-width:44ch;line-height:1.4;font-weight:500}
.phone{position:absolute;right:64px;top:64px;width:330px;height:700px;padding:10px;background:#0E0E10;border-radius:52px;box-shadow:0 30px 60px -30px rgba(0,0,0,.4)}
.phone img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;border-radius:42px;background:#fff}
.dot{position:absolute;left:64px;bottom:56px;width:14px;height:14px;border-radius:50%;background:var(--c,#E8A84B)}
</style></head><body>
<div class="pad">
  <div class="top"><span class="wm" id="wm"></span><span class="kick" id="kick"></span></div>
  <h1 id="t"></h1>
  <p class="sub" id="s"></p>
</div>
<script>
var q=new URLSearchParams(location.search), wm=q.get('wm')||'s|k|ales';
document.getElementById('wm').innerHTML=wm.indexOf('|')>-1?wm.split('|').map(function(x,i){return i===1?'<i>'+x+'</i>':x}).join(''):wm;
document.getElementById('kick').textContent=(q.get('k')||'').replace(/\s*·\s*/g,' · ');
var t=q.get('t')||''; document.getElementById('t').textContent=t;
document.getElementById('s').textContent=q.get('s')||'';
var c=q.get('c'); if(c) document.body.style.setProperty('--c',c);
var p=q.get('p'); if(p){document.body.classList.add('has-phone');var d=document.createElement('div');d.className='phone';d.innerHTML='<img src="/'+p+'" alt="">';document.body.appendChild(d);}
var h=document.getElementById('t'); if(p){h.style.fontSize='64px';h.style.maxWidth='620px'}
if(t.length>44) h.style.fontSize=p?'56px':'64px';
if(t.length>70) h.style.fontSize=p?'44px':'52px';
</script></body></html>
