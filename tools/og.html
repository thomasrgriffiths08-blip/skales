<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Geist";src:url(/assets/fonts/geist-latin.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"Geist";src:url(/assets/fonts/geist-latin-ext.woff2) format("woff2");font-weight:100 900;unicode-range:U+0100-024F,U+1E00-1EFF}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0A0B0D;color:#F4F4F5;overflow:hidden;position:relative;font-family:"Geist",-apple-system,sans-serif}
body::before{content:"";position:absolute;right:-220px;top:-260px;width:900px;height:760px;background:radial-gradient(closest-side,rgba(91,63,224,.42),rgba(91,63,224,.14) 55%,transparent 75%);pointer-events:none}
body::after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.06);pointer-events:none}
.pad{position:relative;padding:56px 64px;height:100%;display:flex;flex-direction:column;justify-content:space-between;width:100%}
body.has-phone .pad{width:760px}
.top{display:flex;align-items:center;gap:20px}
.wm{font-weight:700;font-size:32px;letter-spacing:-.045em}.wm i{font-style:normal;color:#E8A84B}
.kick{font-size:18px;font-weight:500;color:rgba(244,244,245,.6)}
h1{font-weight:600;font-size:80px;line-height:1;letter-spacing:-.04em;max-width:1040px;overflow-wrap:anywhere;text-wrap:balance}
.sub{color:rgba(244,244,245,.66);font-size:24px;max-width:44ch;line-height:1.4;font-weight:450}
.foot{display:flex;align-items:center;gap:14px;font-size:18px;font-weight:500;color:rgba(244,244,245,.6)}
.foot b{display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:999px;background:#E8A84B;color:#141416;font-weight:600}
.phone{position:absolute;right:64px;top:64px;width:330px;height:700px;padding:9px;background:#1B1C21;border-radius:52px;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 40px 80px -30px rgba(0,0,0,.8)}
.phone img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;border-radius:43px;background:#fff}
</style></head><body>
<div class="pad">
  <div class="top"><span class="wm" id="wm"></span><span class="kick" id="kick"></span></div>
  <h1 id="t"></h1>
  <div><p class="sub" id="s"></p></div>
</div>
<script>
var q=new URLSearchParams(location.search), wm=q.get('wm')||'s|k|ales';
document.getElementById('wm').innerHTML=wm.indexOf('|')>-1?wm.split('|').map(function(x,i){return i===1?'<i>'+x+'</i>':x}).join(''):wm;
document.getElementById('kick').textContent=(q.get('k')||'').replace(/\s*·\s*/g,' · ');
var t=q.get('t')||''; document.getElementById('t').textContent=t;
document.getElementById('s').textContent=q.get('s')||'';
var p=q.get('p'); if(p){document.body.classList.add('has-phone');var d=document.createElement('div');d.className='phone';d.innerHTML='<img src="/'+p+'" alt="">';document.body.appendChild(d);}
var h=document.getElementById('t'); if(p){h.style.fontSize='64px';h.style.maxWidth='620px'}
if(t.length>44) h.style.fontSize=p?'56px':'64px';
if(t.length>70) h.style.fontSize=p?'44px':'52px';
</script></body></html>
